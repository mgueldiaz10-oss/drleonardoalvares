<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c28e2b"/>
    </linearGradient>
  </defs>

  <!-- Base container rounded badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#c28e2b" stroke-width="4.5"/>

  <!-- Molecular Quantum Orbitals (Spectroscopy Ellipses) -->
  <ellipse cx="64" cy="64" rx="46" ry="19" fill="none" stroke="#60a5fa" stroke-width="4.5" transform="rotate(-30 64 64)" opacity="0.95"/>
  <ellipse cx="64" cy="64" rx="46" ry="19" fill="none" stroke="#38bdf8" stroke-width="4.5" transform="rotate(30 64 64)" opacity="0.95"/>
  <ellipse cx="64" cy="64" rx="46" ry="19" fill="none" stroke="#c28e2b" stroke-width="4.5" transform="rotate(90 64 64)" opacity="0.9"/>

  <!-- Orbiting Nodes / Atoms -->
  <circle cx="26" cy="42" r="6.5" fill="#38bdf8"/>
  <circle cx="102" cy="86" r="6.5" fill="#38bdf8"/>
  <circle cx="26" cy="86" r="6.5" fill="#60a5fa"/>
  <circle cx="102" cy="42" r="6.5" fill="#60a5fa"/>
  <circle cx="64" cy="18" r="6" fill="#fbbf24"/>
  <circle cx="64" cy="110" r="6" fill="#fbbf24"/>

  <!-- Coherent Laser Pulse Beam through Molecular Center -->
  <line x1="8" y1="64" x2="120" y2="64" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
  <line x1="12" y1="64" x2="116" y2="64" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Quantum Core -->
  <circle cx="64" cy="64" r="15" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="6.5" fill="#ffffff"/>
</svg>
